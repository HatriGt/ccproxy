name: bump-cliproxy

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          CURRENT="$(grep -E '[[:space:]]CLIPROXY_UPSTREAM_TAG:' docker-compose.yml | head -1 | awk '{print $2}')"
          LATEST="$(curl -fsSL https://api.github.com/repos/router-for-me/CLIProxyAPI/releases/latest | jq -r .tag_name)"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/eceasy/cli-proxy-api/tags/${LATEST}")"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "200" ]; then
            echo "Docker Hub missing tag ${LATEST}; skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already on ${LATEST}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Bump ${CURRENT} -> ${LATEST}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and automerge
        if: steps.tags.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.tags.outputs.current }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="chore/bump-cliproxy-${LATEST}"
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr merge "$EXISTING" --squash --auto --delete-branch || gh pr merge "$EXISTING" --squash --delete-branch
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          sed -i -E "s/(CLIPROXY_UPSTREAM_TAG: )v[0-9][0-9.]*/\1${LATEST}/" docker-compose.yml
          sed -i -E "s/(ARG CLIPROXY_UPSTREAM_TAG=)v[0-9][0-9.]*/\1${LATEST}/" images/cli-proxy-api/Dockerfile
          if [ -f .env.example ]; then
            sed -i -E "s/(#?CLIPROXY_IMAGE_TAG=)v[0-9][0-9.]*/\1${LATEST}/" .env.example
          fi
          if git diff --quiet; then
            echo "No changes after sed" >&2
            exit 1
          fi
          git add docker-compose.yml images/cli-proxy-api/Dockerfile .env.example
          git commit -m "chore: bump CLIProxyAPI upstream to ${LATEST}"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --title "chore: bump CLIProxyAPI to ${LATEST}" --body "Auto-bump CLIPROXY_UPSTREAM_TAG ${CURRENT} -> ${LATEST}. Merging redeploys Dokploy ccproxy."
          gh pr merge --squash --auto --delete-branch || gh pr merge --squash --delete-branch
