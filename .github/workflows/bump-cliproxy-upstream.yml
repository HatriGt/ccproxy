name: Bump CLIProxyAPI upstream

# Detect new eceasy/cli-proxy-api releases, open a pin-bump PR, and auto-merge it.
# Dokploy git-sourced compose redeploys when the merge lands on main.

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: bump-cliproxy-upstream
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current and latest tags
        id: tags
        run: |
          set -euo pipefail
          CURRENT="$(grep -E '[[:space:]]CLIPROXY_UPSTREAM_TAG:' docker-compose.yml | head -1 | awk '{print $2}')"
          if [ -z "$CURRENT" ]; then
            echo "Could not parse CLIPROXY_UPSTREAM_TAG from docker-compose.yml" >&2
            exit 1
          fi
          LATEST="$(curl -fsSL https://api.github.com/repos/router-for-me/CLIProxyAPI/releases/latest | jq -r .tag_name)"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not resolve latest CLIProxyAPI release tag" >&2
            exit 1
          fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/eceasy/cli-proxy-api/tags/${LATEST}")"
          if [ "$CODE" != "200" ]; then
            echo "Docker Hub missing eceasy/cli-proxy-api:${LATEST} (HTTP ${CODE}); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already on ${LATEST}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Bump ${CURRENT} -> ${LATEST}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bump PR and auto-merge
        if: steps.tags.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.tags.outputs.current }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="chore/bump-cliproxy-${LATEST}"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH}; ensuring merge"
            gh pr merge "$EXISTING" --squash --auto --delete-branch \
              || gh pr merge "$EXISTING" --squash --delete-branch
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          sed -i -E "s/(CLIPROXY_UPSTREAM_TAG: )v[0-9][0-9.]*/\1${LATEST}/" docker-compose.yml
          sed -i -E "s/(ARG CLIPROXY_UPSTREAM_TAG=)v[0-9][0-9.]*/\1${LATEST}/" images/cli-proxy-api/Dockerfile
          if [ -f .env.example ]; then
            sed -i -E "s/(#?CLIPROXY_IMAGE_TAG=)v[0-9][0-9.]*/\1${LATEST}/" .env.example
          fi

          if git diff --quiet; then
            echo "No file changes after sed; aborting." >&2
            exit 1
          fi

          git add docker-compose.yml images/cli-proxy-api/Dockerfile .env.example
          git commit -m "chore: bump CLIProxyAPI upstream to ${LATEST}"
          git push -u origin "$BRANCH" --force-with-lease

          BODY="## Summary
- Auto-bump \`CLIPROXY_UPSTREAM_TAG\` \`${CURRENT}\` -> \`${LATEST}\`
- Source: https://github.com/router-for-me/CLIProxyAPI/releases/tag/${LATEST}
- Image: \`eceasy/cli-proxy-api:${LATEST}\` (Docker Hub confirmed)

Merging redeploys Dokploy ccproxy (git-sourced compose)."

          PR_URL="$(gh pr create --title "chore: bump CLIProxyAPI to ${LATEST}" --body "$BODY")"
          echo "Created ${PR_URL}"
          gh pr merge --squash --auto --delete-branch \
            || gh pr merge --squash --delete-branch
